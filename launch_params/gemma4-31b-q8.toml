# Gemma 4 31B — Q8_0 (~35GB)
# Dense model, all 31B active. Best for code review and architecture planning.
# M5 Pro 64GB: 256k context with q4_0 KV (~57GB total). ~7GB headroom.
# q4_0 KV halves per-token cache cost vs q8_0, enabling 256k at same RAM as 131k+q8_0.
# repeat_penalty + repeat_last_n suppress Gemma 4's documented looping bug (llama.cpp #21375, #21516).
# reasoning = false: Gemma 4 does NOT use DeepSeek's format; --reasoning-format deepseek corrupts output.

[hf]
repo = "unsloth/gemma-4-31b-it-GGUF"
tag  = "Q8_0"

[meta]
name    = "Gemma 4 31B Q8_0 (Local)"
quant   = "Q8_0"
size_gb = 35
moe     = false
active_params_b = 31

[launch]
threads        = 10
batch          = 512
ubatch         = 128
context        = 262144
kv_cache_k     = "q4_0"
kv_cache_v     = "q4_0"
reasoning      = false
max_tokens     = 32768
context_window = 262144
repeat_penalty = 1.05
repeat_last_n  = 128
