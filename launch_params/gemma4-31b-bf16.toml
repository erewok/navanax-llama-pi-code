# Gemma 4 31B — BF16 (~61GB)
# Dense model, full BF16 precision — best possible code generation quality.
# M3 Max 128GB: 256k context with q8_0 KV (~105GB total). ~23GB headroom.
# BF16 weights (61.4GB) + q8_0 KV (44GB) = ~105GB — exceeds >100GB target.
# q8_0 KV doubles precision vs q4_0, improving multi-turn accuracy at long context.
# repeat_penalty + repeat_last_n suppress Gemma 4's documented looping bug (llama.cpp #21375, #21516).
# reasoning = false: Gemma 4 does NOT use DeepSeek's format; --reasoning-format deepseek corrupts output.

[hf]
repo = "unsloth/gemma-4-31B-it-GGUF"
tag  = "BF16"

[meta]
name    = "Gemma 4 31B BF16 (Local)"
quant   = "BF16"
size_gb = 62
moe     = false
active_params_b = 31

[launch]
threads        = 12
batch          = 1024
ubatch         = 256
context        = 262144
kv_cache_k     = "q8_0"
kv_cache_v     = "q8_0"
reasoning      = false
max_tokens     = 32768
context_window = 262144
repeat_penalty = 1.05
repeat_last_n  = 128
