# Gemma 4 31B QAT — UD-Q4_K_XL (~17GB)
# Dense model, all 31B active. Built for reading and analyzing code.
# Google trained this checkpoint for 4-bit weights (QAT, June 2026), so it keeps
# far more quality than an ordinary Q4. Unsloth reports 96.67% top-1 token
# agreement for this file, versus 87.91% for Google's plain Q4_0 conversion.
# Decodes about twice as fast as the Q8_0 config because the weights are half the size.
#
# M5 Pro 64GB: 256k context with q8_0 KV. Measured ~29GB total.
#   weights 16.1GB resident (memory-mapped) + KV and compute buffers 12.5GB
# The KV formula in model-tuning.md ("Gemma 4 KV cache") predicted ~31GB.
# vision = false skips the 1.2GB vision projector.
#
# SPEED (measured on M5 Pro, Nov 2026):
#   decode:  14.2 tok/s plain, 22-27 tok/s with spec_type = "draft-mtp" (61-74% of draft tokens accepted)
#            Context size (16k vs 256k) does not change decode speed. f16 KV may add ~2 tok/s,
#            within run-to-run noise, and doubles the KV cache.
#   prefill: 262 tok/s at ubatch 256, 282 tok/s at ubatch 512 (1024 and 2048 were no faster)
# draft-mtp makes llama-server download and load the 0.3GB MTP drafter
# (mtp-gemma-4-31B-it.gguf) from the same -hf repo.
# thinking_budget caps thinking at 2048 tokens (~75s at 27 tok/s). Raise it for harder
# analysis, or remove it to let the model think as long as it wants.
#
# Sampling follows Google's and Unsloth's Gemma 4 recommendation: temp 1.0, top_p 0.95, top_k 64.
# thinking = "on" passes `--reasoning on`, which sets the template's enable_thinking flag.
# repeat_penalty + repeat_last_n suppress Gemma 4's documented looping bug (llama.cpp #21375, #21516).
# reasoning = false: Gemma 4 does NOT use DeepSeek's format; --reasoning-format deepseek corrupts output.

[hf]
repo = "unsloth/gemma-4-31B-it-qat-GGUF"
tag  = "UD-Q4_K_XL"

[meta]
name    = "Gemma 4 31B QAT UD-Q4_K_XL (Local)"
quant   = "UD-Q4_K_XL"
size_gb = 17
moe     = false
active_params_b = 31

[launch]
threads        = 10
batch          = 1024
ubatch         = 512
context        = 262144
kv_cache_k     = "q8_0"
kv_cache_v     = "q8_0"
reasoning      = false
thinking       = "on"
thinking_budget = 2048
vision         = false
spec_type      = "draft-mtp"
temperature    = 1.0
top_p          = 0.95
top_k          = 64
max_tokens     = 32768
context_window = 262144
repeat_penalty = 1.05
repeat_last_n  = 128
