# Qwen3.8 27B dense — Q8_0 (~29GB)
# Hybrid attention: 16 of 64 layers use full attention, 48 use Gated DeltaNet.
# Only the 16 full-attention layers grow a KV cache: ~35KB/token with q8_0 KV.
# M5 Pro 64GB: 262k context (the model max) with q8_0 KV (~40GB total). ~24GB headroom.

[hf]
repo = "unsloth/Qwen3.8-27B-GGUF"
tag  = "Q8_0"

[meta]
name    = "Qwen3.8 27B Q8_0 (Local)"
quant   = "Q8_0"
size_gb = 29
moe     = false
active_params_b = 27

[launch]
threads        = 10
batch          = 1024
ubatch         = 256
context        = 262144
kv_cache_k     = "q8_0"
kv_cache_v     = "q8_0"
reasoning      = true
max_tokens     = 32768
context_window = 262144
